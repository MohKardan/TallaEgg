<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="ZARORBIT Graphic Motifs and 1-0-1 Orbital Lattice">
  <defs>
    <pattern id="modGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#2A2F38" stroke-width="0.75"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="#17191D"/>
  <rect width="1200" height="400" fill="url(#modGrid)" opacity="0.55"/>
  <!-- Motif 1: 1-0-1 Orbital Geometry Echo -->
  <g transform="translate(200,200)">
    <g transform="rotate(-56)">
      <ellipse cx="0" cy="0" rx="118" ry="44" fill="none" stroke="#C9A45A" stroke-width="1.6" opacity="0.8"/>
      <ellipse cx="0" cy="0" rx="88" ry="30" fill="none" stroke="#4CB3A5" stroke-width="1" stroke-dasharray="6 6" opacity="0.65"/>
    </g>
    <line x1="-110" y1="-98" x2="72" y2="-98" stroke="#C9A45A" stroke-width="2" opacity="0.55"/>
    <line x1="-72" y1="98" x2="110" y2="98" stroke="#C9A45A" stroke-width="2" opacity="0.55"/>
    <circle cx="0" cy="0" r="4" fill="#F2EEE5"/>
  </g>
  <!-- Motif 2: Architectural Coordinate Frame -->
  <g transform="translate(460,56)">
    <rect x="0" y="0" width="280" height="288" rx="16" fill="#1F2329" fill-opacity="0.7" stroke="#323844" stroke-width="1"/>
    <path d="M 24 0 V 288 M 256 0 V 288 M 0 24 H 280 M 0 264 H 280" stroke="#2D333D" stroke-width="1"/>
    <path d="M 16 24 H 32 M 24 16 V 32 M 248 264 H 264 M 256 256 V 272" stroke="#C9A45A" stroke-width="1.5"/>
    <ellipse cx="140" cy="144" rx="92" ry="34" transform="rotate(-56 140 144)" fill="none" stroke="#C9A45A" stroke-width="1.3" opacity="0.65"/>
    <ellipse cx="140" cy="144" rx="116" ry="44" transform="rotate(22 140 144)" fill="none" stroke="#4CB3A5" stroke-width="1.1" stroke-dasharray="4 5" opacity="0.65"/>
  </g>
  <!-- Motif 3: Interoperable Node Bridge -->
  <g transform="translate(820,80)">
    <path d="M 20 180 C 110 40, 210 200, 320 60" fill="none" stroke="#C9A45A" stroke-width="1.8"/>
    <path d="M 20 60 C 120 180, 220 40, 320 180" fill="none" stroke="#4CB3A5" stroke-width="1.4" stroke-dasharray="5 5"/>
    <circle cx="20" cy="180" r="6" fill="#C9A45A"/>
    <circle cx="170" cy="120" r="7" fill="#17191D" stroke="#F2EEE5" stroke-width="2"/>
    <circle cx="320" cy="60" r="6" fill="#C9A45A"/>
    <circle cx="20" cy="60" r="5" fill="#4CB3A5"/>
    <circle cx="320" cy="180" r="5" fill="#4CB3A5"/>
  </g>
</svg>
